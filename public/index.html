    function createPeer(peerId) {
      const pc = new RTCPeerConnection(ICE);
      localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          socket.emit('signal', { to: peerId, data: { candidate: e.candidate } });
        }
      };

      pc.ontrack = (e) => {
        let el = document.getElementById('a-' + peerId);
        if (!el) {
          el = document.createElement('audio');
          el.id = 'a-' + peerId;
          el.autoplay = true;
          $('audio').appendChild(el);
        }
        el.srcObject = e.streams[0];
      };

      peers[peerId] = pc;
      updateCount();
      return pc;
    }

    function removePeer(peerId) {
      peers[peerId]?.close();
      delete peers[peerId];
      document.getElementById('a-' + peerId)?.remove();
      updateCount();
    }

      socket.on('user-joined', async (peerId) => {
        const pc = createPeer(peerId);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('signal', { to: peerId, data: { sdp: pc.localDescription } });
      });

      socket.on('signal', async ({ from, data }) => {
        const pc = peers[from] || createPeer(from);
        if (data.sdp) {
          await pc.setRemoteDescription(data.sdp);
          if (data.sdp.type === 'offer') {
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('signal', { to: from, data: { sdp: pc.localDescription } });
          }
        } else if (data.candidate) {
          await pc.addIceCandidate(data.candidate);
        }
      });html

      socket.on('user-left', removePeer);

    $('mute').onclick = () => {
